name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: python -m unittest discover -s tests -v > unit-test-results.txt 2>&1

      - name: Upload failed test output
        if: steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-python-${{ matrix.python-version }}
          path: unit-test-results.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report unit test result
        if: steps.unit-tests.outcome == 'failure'
        shell: bash
        run: |
          cat unit-test-results.txt
          exit 1
