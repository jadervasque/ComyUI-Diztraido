name: Audit pending branches

on:
  pull_request:
    paths:
      - ".github/workflows/audit-branches-temporary.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Audit branches against master
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: List and compare repository branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "ComyUI-Diztraido-branch-auditor",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          branches = []
          page = 1
          while True:
              batch = get_json(
                  f"https://api.github.com/repos/{repository}/branches?per_page=100&page={page}"
              )
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          open_pulls = get_json(
              f"https://api.github.com/repos/{repository}/pulls?state=open&per_page=100"
          )

          print("OPEN_PULL_REQUESTS=" + json.dumps([
              {
                  "number": pr.get("number"),
                  "title": pr.get("title"),
                  "head": pr.get("head", {}).get("ref"),
                  "base": pr.get("base", {}).get("ref"),
                  "draft": pr.get("draft"),
                  "mergeable_state": pr.get("mergeable_state"),
                  "html_url": pr.get("html_url"),
              }
              for pr in open_pulls
          ], ensure_ascii=False))

          print(f"BRANCH_COUNT={len(branches)}")
          for branch in sorted(branches, key=lambda item: item["name"].lower()):
              name = branch["name"]
              sha = branch["commit"]["sha"]
              if name == "master":
                  print("BRANCH=" + json.dumps({
                      "name": name,
                      "sha": sha,
                      "default": True,
                  }, ensure_ascii=False))
                  continue

              encoded_name = urllib.parse.quote(name, safe="")
              compare = get_json(
                  f"https://api.github.com/repos/{repository}/compare/master...{encoded_name}"
              )
              files = [
                  {
                      "filename": item.get("filename"),
                      "status": item.get("status"),
                      "additions": item.get("additions"),
                      "deletions": item.get("deletions"),
                  }
                  for item in compare.get("files", [])
              ]
              commits = [
                  {
                      "sha": item.get("sha"),
                      "message": item.get("commit", {}).get("message", "").splitlines()[0],
                  }
                  for item in compare.get("commits", [])
              ]
              print("BRANCH=" + json.dumps({
                  "name": name,
                  "sha": sha,
                  "status": compare.get("status"),
                  "ahead_by": compare.get("ahead_by"),
                  "behind_by": compare.get("behind_by"),
                  "total_commits": compare.get("total_commits"),
                  "files": files,
                  "commits": commits,
              }, ensure_ascii=False))
          PY
