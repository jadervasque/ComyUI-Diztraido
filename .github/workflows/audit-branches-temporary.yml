name: Audit pending branches

on:
  pull_request:
    paths:
      - ".github/workflows/audit-branches-temporary.yml"
      - ".github/scripts/audit_branches_temporary.py"

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Audit branches against master
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: List and compare repository branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/audit_branches_temporary.py
