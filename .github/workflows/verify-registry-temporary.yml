name: Verify Registry publication

on:
  pull_request:
    paths:
      - ".github/workflows/verify-registry-temporary.yml"
      - ".github/scripts/inspect_registry_publication.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-registry:
    name: Inspect diztraido-nodes 0.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Inspect publication and Registry status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/inspect_registry_publication.py
