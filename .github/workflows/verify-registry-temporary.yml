name: Verify Registry publication

on:
  pull_request:
    paths:
      - ".github/workflows/verify-registry-temporary.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-registry:
    name: Inspect diztraido-nodes 0.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect publication workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              "publish-registry.yml/runs?event=push&branch=master&per_page=10"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "ComyUI-Diztraido-registry-inspector",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))

          runs = payload.get("workflow_runs", [])
          print(f"Publication workflow runs found: {len(runs)}")
          for run in runs:
              summary = {
                  "id": run.get("id"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
                  "event": run.get("event"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
                  "html_url": run.get("html_url"),
              }
              print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Inspect Registry node and version endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          urls = [
              "https://api.comfy.org/nodes/diztraido-nodes",
              "https://api.comfy.org/nodes/diztraido-nodes/versions/0.1.0",
              "https://api.comfy.org/nodes/diztraido-nodes/install?version=0.1.0",
          ]

          results = {}
          for url in urls:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "ComyUI-Diztraido-registry-inspector",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      payload = json.loads(body)
                      results[url] = {"http": response.status, "payload": payload}
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError:
                      payload = body
                  results[url] = {"http": error.code, "payload": payload}

          for url, result in results.items():
              print(f"\nEndpoint: {url}")
              print(json.dumps(result, indent=2, ensure_ascii=False)[:12000])

          version_result = results[urls[1]]
          version_payload = version_result.get("payload")
          if version_result.get("http") == 200 and isinstance(version_payload, dict):
              if (
                  version_payload.get("node_id") == "diztraido-nodes"
                  and version_payload.get("version") == "0.1.0"
                  and version_payload.get("status") == "NodeVersionStatusActive"
              ):
                  print("Verified: diztraido-nodes@0.1.0 is active in Comfy Registry.")
                  raise SystemExit(0)

          raise SystemExit("Version 0.1.0 is not active in Comfy Registry.")
          PY
