[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["nodes", "routes", "services"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
